services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: crmigrejas-app
    container_name: crmigrejas-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:MY4w0jozvT5kJZmfnBdf7417d8NwtTS/qsH76Ni8L/g=
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: crmigrejas
      DB_USERNAME: crmigrejas
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      memcached:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    container_name: crmigrejas-web
    depends_on:
      - app
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  queue:
    image: crmigrejas-app
    container_name: crmigrejas-queue
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=90
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:MY4w0jozvT5kJZmfnBdf7417d8NwtTS/qsH76Ni8L/g=
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: crmigrejas
      DB_USERNAME: crmigrejas
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      memcached:
        condition: service_started

  scheduler:
    image: crmigrejas-app
    container_name: crmigrejas-scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:MY4w0jozvT5kJZmfnBdf7417d8NwtTS/qsH76Ni8L/g=
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: crmigrejas
      DB_USERNAME: crmigrejas
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      memcached:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: crmigrejas-mysql
    environment:
      MYSQL_DATABASE: crmigrejas
      MYSQL_USER: crmigrejas
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: crmigrejas-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

  memcached:
    image: memcached:1.6-alpine
    container_name: crmigrejas-memcached
    command: ["memcached", "-m", "128", "-c", "1024", "-I", "2m", "-p", "11211", "-u", "memcached"]

volumes:
  mysql-data:
  redis-data:
